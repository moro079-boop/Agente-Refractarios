# Definicion geometrica de la olla.
#
# PLANTILLA - los valores de abajo son un caso tipico de olla de ~150 t.
# Sustituir por las dimensiones reales medidas de la olla del usuario:
# diametro interior libre, altura util, y espesor de CADA capa. Estos son los
# datos que mas mueven el resultado; entrarlos mal invalida todo lo demas.

ladle:
  name: olla_acero_150t
  capacity_t: 150
  freeboard: 0.35          # [m] borde libre por encima del nivel de acero
  notes: >-
    Plantilla de olla de acería con revestimiento de trabajo de castable de
    alumina-espinela. Reemplazar espesores y materiales con los reales.

  sections:

    wall:
      geometry: cylindrical
      inner_radius: 1.60     # [m] radio interior libre (cara caliente)
      height: 3.40           # [m] altura util de pared en contacto con acero
      layers:
        - {name: revestimiento_trabajo, material: alumina_spinel_castable, thickness_mm: 160, n_cells: 24, grading: 1.08}
        - {name: revestimiento_seguridad, material: high_alumina_brick_70,  thickness_mm: 70,  n_cells: 8}
        - {name: aislante,               material: microporous_board,       thickness_mm: 15,  n_cells: 4}
        - {name: carcasa,                material: carbon_steel_shell,      thickness_mm: 30,  n_cells: 4}

    bottom:
      geometry: planar
      area: 8.04             # [m2] = pi * r^2 con r = 1.60 m
      layers:
        - {name: revestimiento_trabajo, material: alumina_spinel_castable, thickness_mm: 250, n_cells: 28, grading: 1.08}
        - {name: revestimiento_seguridad, material: high_alumina_brick_70,  thickness_mm: 90,  n_cells: 8}
        - {name: aislante,               material: microporous_board,       thickness_mm: 20,  n_cells: 4}
        - {name: carcasa,                material: carbon_steel_shell,      thickness_mm: 40,  n_cells: 4}
